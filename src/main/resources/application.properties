spring.application.name=tienda

# Para definir el puerto donde escuchará el servidor
server.port=8080

# Para definir el formato de fecha/hora del log en la consola
logging.pattern.dateformat=hh:mm

# Para eliminar el banner de Spring
spring.main.banner-mode=off

# Desactivar la caché de Thymeleaf durante el desarrollo
spring.thymeleaf.cache=false

# Conexión local a la BD Techshop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techshop

# Usuario y clave creados con creaTablas.sql
spring.datasource.username=usuario_prueba
spring.datasource.password=Usuar1o_Clave.

# Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Mostrar información de las consultas en la consola
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE